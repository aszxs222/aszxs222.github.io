<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线音乐播放器 - ASZXS工具集</title>
    <script src="/redirect.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 30px 0;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: #888;
            font-size: 1.1em;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #e94560;
            text-decoration: none;
            font-size: 0.9em;
        }
        .back-link:hover {
            text-decoration: underline;
        }

        /* 播放器区域 */
        .player-section {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        .now-playing {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .album-art {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.3);
        }
        .track-info {
            flex: 1;
        }
        .track-title {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        .track-artist {
            color: #888;
        }

        /* 进度条 */
        .progress-container {
            margin: 20px 0;
        }
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            width: 0%;
            border-radius: 3px;
            transition: width 0.1s;
        }
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #888;
            margin-top: 5px;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .control-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5em;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: all 0.3s;
        }
        .control-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        .control-btn.play {
            font-size: 2.5em;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.3);
        }
        .control-btn.play:hover {
            transform: scale(1.05);
        }

        /* 音量控制 */
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .volume-slider {
            width: 100px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            outline: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #e94560;
            border-radius: 50%;
            cursor: pointer;
        }

        /* 分类标签 */
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .category-tab {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            background: none;
            color: #aaa;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.25s;
        }
        .category-tab:hover {
            border-color: #e94560;
            color: #fff;
        }
        .category-tab.active {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-color: transparent;
            color: #fff;
        }

        /* 播放列表 */
        .playlist-section {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .playlist-header h2 {
            font-size: 1.3em;
        }
        .track-count {
            color: #888;
            font-size: 0.9em;
        }
        .playlist {
            list-style: none;
        }
        .playlist-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 5px;
        }
        .playlist-item:hover {
            background: rgba(255,255,255,0.1);
        }
        .playlist-item.active {
            background: rgba(233, 69, 96, 0.2);
            border-left: 3px solid #e94560;
        }
        .track-number {
            width: 30px;
            color: #888;
            font-size: 0.9em;
        }
        .track-icon {
            margin-right: 15px;
            font-size: 1.2em;
        }
        .playlist-item .track-name {
            flex: 1;
        }
        .track-duration {
            color: #888;
            font-size: 0.9em;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        .empty-state .icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <!-- 音频元素 -->
    <audio id="audioPlayer"></audio>

    <div class="container">
        <a href="/" class="back-link">← 返回首页</a>

        <div class="header">
            <h1>🎶 在线音乐播放器</h1>
            <p>享受你的音乐时光</p>
        </div>

        <!-- 播放器区域 -->
        <div class="player-section">
            <div class="now-playing">
                <div class="album-art" id="albumArt">🎵</div>
                <div class="track-info">
                    <div class="track-title" id="trackTitle">未选择音乐</div>
                    <div class="track-artist" id="trackArtist">请从下方列表选择</div>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" id="prevBtn" title="上一首">⏮</button>
                <button class="control-btn play" id="playBtn" title="播放">▶</button>
                <button class="control-btn" id="nextBtn" title="下一首">⏭</button>
            </div>

            <div class="volume-control">
                <span>🔊</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
            </div>
        </div>

        <!-- 播放列表 -->
        <div class="playlist-section">
            <div class="playlist-header">
                <h2>播放列表</h2>
                <span class="track-count" id="trackCount">0 首歌曲</span>
            </div>
            <div class="category-tabs" id="categoryTabs"></div>
            <ul class="playlist" id="playlist">
                <!-- 音乐列表将通过JS动态加载 -->
            </ul>
        </div>

        <div class="footer">
            <p>所有音乐均在本地播放 | ASZXS工具集</p>
        </div>
    </div>

    <script>
        // 音乐索引（按分类）
        const categories = [

            },
            {
                name: "中文歌",
                icon: "🎤",
                tracks: [
                    { name: "上下五千年", file: "上下五千年-小少焱#2sRymg.mp3" },
                    { name: "不问", file: "不问ciaga.mp3" },
                    { name: "你看，天黑了(交响乐版)", file: "你看，天黑了(交响乐版) - 宝藏男孩.mp3" },
                    { name: "光辉岁月", file: "光辉岁月-Beyond.mp3" },
                    { name: "城南花已开", file: "城南花已开 - 三亩地.mp3" },
                    { name: "天真的橡皮(DJ版)", file: "天真的橡皮(DJ版)-白水寒.mp3" },
                    { name: "安和桥", file: "安和桥-宋冬野.mp3" },
                    { name: "就是哪吒", file: "就是哪吒-唐汉霄#2FZcdC.mp3" },
                    { name: "库里", file: "库里 - 龙奔.mp3" },
                    { name: "我记得", file: "我记得-赵雷#2rjxcv.mp3" },
                    { name: "春庭雪(DJ Wave版)", file: "春庭雪(DJ Wave版) - 邓寓君(等什么君).mp3" },
                    { name: "江南Style", file: "江南Style - Psy.mp3" },
                    { name: "海阔天空", file: "海阔天空.mp3" },
                    { name: "爱错", file: "爱错-王力宏.mp3" },
                    { name: "辞九门回忆", file: "辞九门回忆-邓寓君.等什么君.mp3" },
                    { name: "颗秒funkphonk", file: "颗秒funkphonk.mp3" },
                    { name: "饿狼传说(港囧电影片头曲)", file: "饿狼传说-.港囧.电影片头曲-张学友#1xPND.mp3" },
                    { name: "诀别书", file: "诀别书.mp3" },
                ]
            },
            {
                name: "纯音乐",
                icon: "🎹",
                tracks: [
                    { name: "Call of Silence", file: "Call of Silence - Haru&CHANYEONG KIM.mp3" },
                    { name: "Daylight(纯音乐)", file: "Daylight(纯音乐)-serings.mp3" },
                    { name: "Lake Arrowhead(Radio Mix)", file: "Lake Arrowhead(Radio Mix) - Nora En Pure.mp3" },
                    { name: "otherside", file: "otherside - Lena Raine&Minecraft.mp3" },
                    { name: "Pigstep(Mono Mix)", file: "Pigstep(Mono Mix) - Lena Raine&Minecraft.mp3" },
                    { name: "Relic(Monolism Remix)", file: "Relic(Monolism Remix) - Minecraft.mp3" },
                    { name: "sans.", file: "sans. - Toby Foxmp3.mp3" },
                    { name: "Sea of Tranquility", file: "Sea of Tranquility - BeMax.mp3" },
                    { name: "Unwelcome School", file: "Unwelcome School - Yoko.mp3" },
                    { name: "Wait", file: "Wait - C418.mp3" },
                    { name: "Wet Hands", file: "Wet Hands - C418.mp3" },
                ]
            },
            {
                name: "英文歌",
                icon: "🌍",
                tracks: [
                    { name: "Animals (Big Boi Remix)", file: "Animals (Big Boi Remix) - Maroon 5.mp3" },
                    { name: "Bad Apple..", file: "Bad Apple..-初音ミク.mp3" },
                    { name: "Beat It", file: "Beat It - Michael Jackson.mp3" },
                    { name: "Believer", file: "Believer - Imagine Dragons.mp3" },
                    { name: "Blinding Lights", file: "Blinding Lights - The Weeknd.mp3" },
                    { name: "Bones", file: "Bones - Imagine Dragons.mp3" },
                    { name: "Catch My Breath", file: "Catch My Breath - Kelly Clarkson.mp3" },
                    { name: "Edge Of My Life", file: "Edge Of My Life - Manafest.mp3" },
                    { name: "Experience", file: "Experience.mp3" },
                    { name: "Faded", file: "Faded - Alan Walker.mp3" },
                    { name: "Funky Town", file: "Funky Town - Lipps Inc..mp3" },
                    { name: "III - Athletics", file: "III - Athletics.mp3" },
                    { name: "MEGALOVANIA", file: "MEGALOVANIA - Toby Fox.mp3" },
                    { name: "Midnight City", file: "Midnight City.mp3" },
                    { name: "Natural", file: "Natural - Imagine Dragons.mp3" },
                    { name: "Nevada", file: "Nevada - Vicetone.mp3" },
                    { name: "Never Gonna Give You Up", file: "Never Gonna Give You Up - Rick Astley.mp3" },
                    { name: "NO BATIDÃO", file: "NO BATIDÃO-ZxKAI.mp3" },
                    { name: "Once Upon A Time(House Mix)", file: "Once Upon A Time(House Mix) - Max Oazo&Moonessa.mp3" },
                    { name: "Counting Stars", file: "OneRepublic - Counting Stars.mp3" },
                    { name: "Pastlives", file: "Pastlives - sapientdream.mp3" },
                    { name: "Payphone", file: "Payphone - Maroon 5&Wiz Khalifa.mp3" },
                    { name: "Roots", file: "Roots - Imagine Dragons.mp3" },
                    { name: "Sacred Play Secret Place", file: "Sacred Play Secret Place - Matryoshka.mp3" },
                    { name: "See You Again", file: "See You Again (feat. Charlie Puth) - Wiz Khalifa&Charlie Puth.mp3" },
                    { name: "Shots (Broiler Remix)", file: "Shots (Broiler Remix) - Imagine Dragons.mp3" },
                    { name: "Sirens", file: "Sirens - Imagine Dragons.mp3" },
                    { name: "Slow Down", file: "Slow Down - Madnap&Pauline Herr.mp3" },
                    { name: "Sold Out", file: "Sold Out - Hawk Nelson&Jonathan Steingard.mp3" },
                    { name: "Something Just Like This", file: "Something Just Like This - The Chainsmokers&Coldplay.mp3" },
                    { name: "STAY(Clean)", file: "STAY(Clean) - The Kid LAROI&Justin Bieber.mp3" },
                    { name: "Teeth", file: "Teeth - 5 Seconds of Summer.mp3" },
                    { name: "Thriller", file: "Thriller - Michael Jackson.mp3" },
                    { name: "Timber", file: "Timber - Pitbull&Kesha.mp3" },
                    { name: "Unity", file: "Unity - TheFatRat.mp3" },
                    { name: "Wake(Live)", file: "Wake(Live)-Hillsong Young And Free.mp3" },
                    { name: "Warriors", file: "Warriors - Imagine Dragons.mp3" },
                    { name: "We Never", file: "We Never - Hi Noise.mp3" },
                    { name: "We Will Rock You", file: "We Will Rock You - Queen.mp3" },
                    { name: "Y.M.C.A.", file: "Y.M.C.A.-The Village People.mp3" },
                ]
            },
        ];

        // 构建"全部"列表（带 category 标记）
        categories[0].tracks = categories.slice(1).flatMap(cat =>
            cat.tracks.map(t => ({ ...t, category: cat.name }))
        );

        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const volumeSlider = document.getElementById('volumeSlider');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const trackCount = document.getElementById('trackCount');
        const playlistEl = document.getElementById('playlist');
        const categoryTabsEl = document.getElementById('categoryTabs');

        let currentCategoryIndex = 0;  // 当前选中分类
        let currentTrack = 0;          // 在当前分类列表中的下标
        let isPlaying = false;

        function currentList() {
            return categories[currentCategoryIndex].tracks;
        }

        // 渲染分类标签
        function initTabs() {
            categoryTabsEl.innerHTML = categories.map((cat, i) => `
                <button class="category-tab ${i === 0 ? 'active' : ''}" data-index="${i}">
                    ${cat.icon} ${cat.name}
                    <span style="color:rgba(255,255,255,0.5);font-size:0.85em;margin-left:4px">${cat.tracks.length}</span>
                </button>
            `).join('');

            categoryTabsEl.querySelectorAll('.category-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentCategoryIndex = parseInt(btn.dataset.index);
                    currentTrack = 0;
                    categoryTabsEl.querySelectorAll('.category-tab').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderPlaylist();
                    // 不打断当前播放，只重绘列表
                });
            });
        }

        // 渲染播放列表
        function renderPlaylist() {
            const list = currentList();
            trackCount.textContent = `${list.length} 首歌曲`;

            playlistEl.innerHTML = list.map((track, index) => {
                const isActive = track.file === (audio.src ? decodeURIComponent(audio.src.split('/').pop()) : '');
                return `
                <li class="playlist-item ${isActive ? 'active' : ''}" data-index="${index}">
                    <span class="track-number">${index + 1}</span>
                    <span class="track-icon">${categories[currentCategoryIndex].name === '全部' ? getCatIcon(track.category) : categories[currentCategoryIndex].icon}</span>
                    <span class="track-name">${track.name}</span>
                    <span class="track-duration">${track.duration || '--:--'}</span>
                </li>`;
            }).join('');

            playlistEl.querySelectorAll('.playlist-item').forEach(item => {
                item.addEventListener('click', () => {
                    currentTrack = parseInt(item.dataset.index);
                    loadTrack(currentTrack);
                    playTrack();
                });
            });
        }

        function getCatIcon(catName) {
            const cat = categories.find(c => c.name === catName);
            return cat ? cat.icon : '🎵';
        }

        // 加载音轨
        function loadTrack(index) {
            const list = currentList();
            if (!list.length) return;
            currentTrack = index;
            const track = list[index];
            audio.src = track.file;
            trackTitle.textContent = track.name;
            trackArtist.textContent = track.category || categories[currentCategoryIndex].name;
            renderPlaylist();
        }

        function playTrack() {
            audio.play();
            isPlaying = true;
            playBtn.textContent = '⏸';
        }

        function pauseTrack() {
            audio.pause();
            isPlaying = false;
            playBtn.textContent = '▶';
        }

        playBtn.addEventListener('click', () => {
            if (!currentList().length) return;
            if (isPlaying) pauseTrack(); else playTrack();
        });

        prevBtn.addEventListener('click', () => {
            const list = currentList();
            if (!list.length) return;
            currentTrack = (currentTrack - 1 + list.length) % list.length;
            loadTrack(currentTrack);
            playTrack();
        });

        nextBtn.addEventListener('click', () => {
            const list = currentList();
            if (!list.length) return;
            currentTrack = (currentTrack + 1) % list.length;
            loadTrack(currentTrack);
            playTrack();
        });

        audio.addEventListener('timeupdate', () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${progress}%`;
            currentTimeEl.textContent = formatTime(audio.currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value / 100;
        });

        audio.addEventListener('ended', () => {
            const list = currentList();
            currentTrack = (currentTrack + 1) % list.length;
            loadTrack(currentTrack);
            playTrack();
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // 初始化
        audio.volume = 0.8;
        initTabs();
        renderPlaylist();
    </script>
</body>
</html>
