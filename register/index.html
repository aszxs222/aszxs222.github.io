<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · ASZXS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/config.js"></script>
    <script src="/auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0b1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        .card {
            background: #13132a;
            padding: 48px 40px 40px;
            border-radius: 32px;
            width: 380px;
            border: 1px solid #2a2a4a;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .back {
            color: #666;
            text-decoration: none;
            font-size: 0.85em;
            display: inline-block;
            margin-bottom: 20px;
        }
        .back:hover {
            color: #fff;
        }
        .logo {
            font-size: 2em;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .sub {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 28px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            color: #888;
            font-size: 0.8em;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: #1a1a35;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95em;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #a78bfa;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            color: #fff;
            font-weight: 700;
            font-size: 1em;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(167, 139, 250, 0.3);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .msg {
            text-align: center;
            margin-top: 16px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85em;
            display: none;
            line-height: 1.4;
        }
        .msg.error {
            background: rgba(255, 0, 0, 0.12);
            color: #f87171;
            display: block;
            border: 1px solid rgba(255, 0, 0, 0.15);
        }
        .msg.success {
            background: rgba(52, 211, 153, 0.1);
            color: #6ee7b7;
            display: block;
            border: 1px solid rgba(52, 211, 153, 0.15);
        }
        .msg.info {
            background: rgba(96, 165, 250, 0.1);
            color: #93bbfc;
            display: block;
            border: 1px solid rgba(96, 165, 250, 0.15);
        }
        .footer {
            text-align: center;
            color: #444;
            font-size: 0.75em;
            margin-top: 20px;
        }
        .footer a {
            color: #a78bfa;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .cooldown-tip {
            font-size: 0.75em;
            color: #666;
            text-align: center;
            margin-top: 8px;
            display: none;
        }
        .cooldown-tip.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="card">
        <a href="/" class="back">← 返回首页</a>
        <div class="logo">⚡ ASZXS</div>
        <div class="sub">创建你的账户</div>

        <div class="input-group">
            <label>邮箱</label>
            <input type="email" id="registerEmail" placeholder="your@email.com">
        </div>
        <div class="input-group">
            <label>用户名</label>
            <input type="text" id="registerUsername" placeholder="给自己一个昵称">
        </div>
        <div class="input-group">
            <label>密码</label>
            <input type="password" id="registerPassword" placeholder="至少6位">
        </div>
        <button class="btn" id="registerBtn">注册</button>

        <div id="msg" class="msg"></div>
        <div class="cooldown-tip" id="cooldownTip">⏳ 请等待 <span id="cooldownCount">60</span> 秒后再试</div>
        <div class="footer">
            已有账户？<a href="/login/">去登录</a>
        </div>
    </div>

    <script>
        const msg = document.getElementById('msg');
        const registerBtn = document.getElementById('registerBtn');
        const registerEmail = document.getElementById('registerEmail');
        const registerUsername = document.getElementById('registerUsername');
        const registerPassword = document.getElementById('registerPassword');
        const cooldownTip = document.getElementById('cooldownTip');
        const cooldownCount = document.getElementById('cooldownCount');

        let isCooldown = false;
        let cooldownTimer = null;

        function showMessage(text, type = 'error') {
            msg.innerHTML = text;
            msg.className = `msg ${type}`;
        }

        function hideMessage() {
            msg.className = 'msg';
            msg.style.display = 'none';
        }

        function setLoading(loading) {
            if (loading) {
                registerBtn.disabled = true;
                registerBtn.innerHTML = '<span class="spinner"></span> 注册中...';
            } else {
                registerBtn.disabled = false;
                registerBtn.innerHTML = '注册';
            }
        }

        function startCooldown(seconds = 60) {
            isCooldown = true;
            registerBtn.disabled = true;
            cooldownTip.classList.add('show');
            let remaining = seconds;

            cooldownCount.textContent = remaining;

            if (cooldownTimer) clearInterval(cooldownTimer);
            cooldownTimer = setInterval(() => {
                remaining--;
                cooldownCount.textContent = remaining;
                if (remaining <= 0) {
                    clearInterval(cooldownTimer);
                    cooldownTimer = null;
                    isCooldown = false;
                    registerBtn.disabled = false;
                    cooldownTip.classList.remove('show');
                    showMessage('✅ 可以重新尝试注册了', 'success');
                    setTimeout(hideMessage, 2000);
                }
            }, 1000);
        }

        async function handleRegister() {
            // 防重复点击
            if (registerBtn.disabled) return;

            const email = registerEmail.value.trim();
            const username = registerUsername.value.trim();
            const password = registerPassword.value;

            // 清空旧消息
            hideMessage();

            // 验证输入
            if (!email) { showMessage('📧 请输入邮箱地址', 'error'); return; }
            if (!password) { showMessage('🔒 请输入密码', 'error'); return; }
            if (password.length < 6) { showMessage('🔒 密码至少6位', 'error'); return; }

            // 显示加载状态
            setLoading(true);

            try {
                const { data, error } = await register(email, username, password);

                if (error) {
                    // 处理特定错误
                    if (error.message.includes('already registered')) {
                        showMessage('📧 该邮箱已注册，请直接 <a href="/login/" style="color:#a78bfa;">登录</a>', 'error');
                    } else if (error.message.includes('rate limit')) {
                        showMessage('⏳ 请求过于频繁，请等待60秒后再试', 'error');
                        startCooldown(60);
                    } else {
                        showMessage('❌ ' + error.message, 'error');
                    }
                    setLoading(false);
                    return;
                }

                // 注册成功（邮箱验证开启时不会产生 session，需用户点邮件链接）
                const userEmail = data.user?.email || email;
                showMessage(
                    `✅ 注册成功！验证邮件已发送至 <strong>${userEmail}</strong><br>📬 请查收邮箱（如未收到，请检查垃圾邮件箱），验证后即可登录`,
                    'success'
                );
                setLoading(false);

                // 自动跳转到登录页
                setTimeout(() => {
                    window.location.href = '/login/';
                }, 4500);

            } catch (err) {
                showMessage('⚠️ 网络错误，请稍后重试', 'error');
                setLoading(false);
            }
        }

        // 事件绑定
        registerBtn.addEventListener('click', handleRegister);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !registerBtn.disabled) {
                handleRegister();
            }
        });

        // 输入框清空消息
        registerEmail.addEventListener('input', hideMessage);
        registerUsername.addEventListener('input', hideMessage);
        registerPassword.addEventListener('input', hideMessage);

        // 已登录用户访问注册页 → 直接去仪表盘
        (async function() {
            if (await isLoggedIn()) {
                window.location.href = '/dashboard/';
            }
        })();
    </script>
</body>
</html>
