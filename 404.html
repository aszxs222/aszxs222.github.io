<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 | ASZXS 工具集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 32px;
            padding: 50px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        .code {
            font-size: 120px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            line-height: 1;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 15px;
        }
        .message {
            color: #666;
            line-height: 1.7;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 14px 35px;
            border-radius: 40px;
            font-weight: 600;
            margin: 5px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px -5px rgba(102,126,234,0.4);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }
        .btn-outline:hover {
            background: #667eea;
            color: white;
        }
        .tools {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 13px;
            color: #999;
        }
        .tools a {
            color: #667eea;
            text-decoration: none;
            margin: 0 8px;
        }
        .tools a:hover { text-decoration: underline; }
        .auto-redirect {
            font-size: 12px;
            color: #aaa;
            margin-top: 20px;
        }
    </style>
    <script>
        // 5秒后自动跳转到首页
        let seconds = 5;
        function updateCountdown() {
            const el = document.getElementById('countdown');
            if (el) {
                el.textContent = seconds;
                if (seconds === 0) {
                    window.location.href = '/';
                }
                seconds--;
            }
        }
        setInterval(updateCountdown, 1000);
    </script>
</head>
<body>
    <div class="card">
        <div class="code">404</div>
        <h2>🔍 页面走丢了</h2>
        <div class="message">
            你访问的页面不存在<br>
            可能已被移动、删除或从未创建过
        </div>
        <div>
            <a href="/" class="btn">🏠 返回首页</a>
            <a href="javascript:history.back()" class="btn btn-outline">◀ 返回上一页</a>
        </div>
        <div class="tools">
            🛠️ ASZXS 工具集
            <a href="/music/">🎵 音乐</a>
            <a href="/musicmanji/">🎧 音乐专区</a>
            <a href="/music-converter/">🎙️ 转换器</a>
            <a href="/text-stats/">📊 文本统计</a>
            <a href="/typing-trainer/">⌨️ 打字训练</a>
            <a href="/gomoku/">🎮 五子棋</a>
        </div>
        <div class="auto-redirect">
            ⏱️ <span id="countdown">5</span> 秒后自动跳转首页
        </div>
    </div>
</body>
</html>
