<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 · ASZXS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0b1a;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        .nav {
            background: #13132a;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a4a;
        }
        .logo {
            font-size: 1.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .nav-right .name {
            color: #aaa;
            font-size: 0.9em;
        }
        .btn-logout {
            padding: 6px 16px;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            background: transparent;
            color: #888;
            cursor: pointer;
            font-size: 0.8em;
            transition: 0.3s;
        }
        .btn-logout:hover {
            background: #2a2a4a;
            color: #fff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 24px;
            text-align: center;
        }
        .greeting {
            font-size: 2.2em;
            margin-bottom: 12px;
        }
        .greeting span {
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub {
            color: #666;
            font-size: 1em;
            margin-bottom: 48px;
        }
        .empty-state {
            background: #13132a;
            border: 2px dashed #2a2a4a;
            border-radius: 24px;
            padding: 80px 40px;
        }
        .empty-state .icon {
            font-size: 4em;
            margin-bottom: 16px;
            opacity: 0.4;
        }
        .empty-state h2 {
            color: #888;
            font-weight: 400;
            font-size: 1.2em;
        }
        .empty-state p {
            color: #555;
            font-size: 0.9em;
            margin-top: 8px;
        }
        .footer {
            text-align: center;
            color: #333;
            font-size: 0.75em;
            padding: 40px 0 20px;
            border-top: 1px solid #1a1a35;
            margin-top: 60px;
        }
        .nav .home-link {
            color: #888;
            text-decoration: none;
            font-size: 0.85em;
        }
        .nav .home-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">⚡ ASZXS</div>
        <div class="nav-right">
            <a href="/" class="home-link">🏠 首页</a>
            <span class="name" id="userName">用户</span>
            <button class="btn-logout" onclick="handleLogout()">退出</button>
        </div>
    </div>

    <div class="container">
        <div class="greeting">
            👋 你好，<span id="greetingName">朋友</span>
        </div>
        <div class="sub">欢迎回到你的控制台</div>

        <div class="empty-state">
            <div class="icon">🛠️</div>
            <h2>这里暂时是空的</h2>
            <p>工具正在开发中，敬请期待</p>
        </div>

        <div class="footer">
            © 2026 ASZXS · 数据加密存储
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vdkxbznzzkazzassxydd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__Wq6-zuT78CA1wV_on0T7A_v1T1qCch';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkAuth() {
            const { data } = await supabase.auth.getSession();
            if (!data.session) {
                window.location.href = '/';
                return;
            }
            const user = data.session.user;
            const name = user.user_metadata?.username || user.email?.split('@')[0] || '用户';
            document.getElementById('greetingName').textContent = name;
            document.getElementById('userName').textContent = name;
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            window.location.href = '/';
        }

        checkAuth();
    </script>
</body>
</html>
