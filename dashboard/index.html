<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 · ASZXS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/config.js"></script>
    <script src="/auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0b1a;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        .nav {
            background: #13132a;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a4a;
        }
        .logo {
            font-size: 1.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .nav-right .name {
            color: #aaa;
            font-size: 0.9em;
        }
        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95em;
        }
        .btn-logout {
            padding: 6px 16px;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            background: transparent;
            color: #888;
            cursor: pointer;
            font-size: 0.8em;
            transition: 0.3s;
        }
        .btn-logout:hover {
            background: #2a2a4a;
            color: #fff;
        }
        .nav-link {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.85em;
            padding: 6px 14px;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            transition: 0.3s;
        }
        .nav-link:hover {
            background: #1a1a35;
            color: #fff;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 56px 24px;
        }
        .greeting {
            font-size: 2.2em;
            margin-bottom: 8px;
        }
        .greeting span {
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub {
            color: #666;
            font-size: 1em;
            margin-bottom: 20px;
        }
        .user-meta {
            color: #555;
            font-size: 0.85em;
            margin-bottom: 28px;
        }
        .guest-banner {
            background: #13132a;
            border: 1px solid #2a2a4a;
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .guest-banner .text {
            color: #aaa;
            font-size: 0.9em;
        }
        .guest-banner .actions {
            display: flex;
            gap: 10px;
        }
        .section-title {
            color: #888;
            font-size: 0.95em;
            margin-bottom: 18px;
            font-weight: 600;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }
        .card {
            background: #13132a;
            border: 1px solid #2a2a4a;
            border-radius: 20px;
            padding: 26px 24px;
            text-decoration: none;
            color: #fff;
            transition: 0.3s;
            display: block;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #a78bfa;
            box-shadow: 0 14px 40px rgba(167, 139, 250, 0.15);
        }
        .card .icon {
            font-size: 2em;
            margin-bottom: 12px;
        }
        .card .title {
            font-size: 1.15em;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .card .desc {
            color: #777;
            font-size: 0.85em;
            line-height: 1.5;
        }
        .footer {
            text-align: center;
            color: #333;
            font-size: 0.75em;
            padding: 40px 0 20px;
            border-top: 1px solid #1a1a35;
            margin-top: 60px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/" class="logo">⚡ ASZXS</a>
        <!-- 已登录时显示 -->
        <div class="nav-right" id="userBox">
            <span class="avatar" id="avatar">?</span>
            <span class="name" id="userName">用户</span>
            <button class="btn-logout" onclick="logout()">退出</button>
        </div>
        <!-- 未登录时显示 -->
        <div class="nav-right hidden" id="guestBox">
            <a href="/login/" class="nav-link">登录</a>
            <a href="/register/" class="nav-link">注册</a>
        </div>
    </div>

    <div class="container">
        <div class="greeting">
            👋 你好，<span id="greetingName">朋友</span>
        </div>
        <div class="sub">欢迎来到你的工具控制台</div>
        <div class="user-meta hidden" id="userEmail"></div>

        <!-- 未登录提示（view-only 入口仍可用）-->
        <div class="guest-banner hidden" id="guestBanner">
            <div class="text">🔓 登录后即可使用全部工具功能；现在也可以浏览，但部分操作需登录。</div>
            <div class="actions">
                <a href="/login/" class="nav-link">登录</a>
                <a href="/register/" class="nav-link">注册</a>
            </div>
        </div>

        <div class="section-title">🛠️ 可用工具</div>
        <div class="cards">
            <a class="card" href="/tools/text-stats/">
                <div class="icon">📝</div>
                <div class="title">文本统计</div>
                <div class="desc">实时统计字符数、词数、行数与字节数，写作排版好帮手。</div>
            </a>
            <a class="card" href="/tools/music-converter/">
                <div class="icon">🎵</div>
                <div class="title">音乐转换器</div>
                <div class="desc">上传音频文件，调整采样率与声道，导出为 WAV。</div>
            </a>
        </div>

        <div class="footer">
            © 2026 ASZXS · 数据加密存储
        </div>
    </div>

    <script>
        async function init() {
            const user = await getCurrentUser();

            if (user) {
                const name = displayName(user);
                const initial = (name[0] || '?').toUpperCase();

                document.getElementById('greetingName').textContent = name;
                document.getElementById('userName').textContent = name;
                document.getElementById('avatar').textContent = initial;

                const emailEl = document.getElementById('userEmail');
                if (user.email) {
                    emailEl.textContent = '📧 ' + user.email;
                    emailEl.classList.remove('hidden');
                }

                document.getElementById('userBox').classList.remove('hidden');
                document.getElementById('guestBox').classList.add('hidden');
                document.getElementById('guestBanner').classList.add('hidden');
            } else {
                document.getElementById('greetingName').textContent = '朋友';
                document.getElementById('userBox').classList.add('hidden');
                document.getElementById('guestBox').classList.remove('hidden');
                document.getElementById('guestBanner').classList.remove('hidden');
            }
        }

        init();
    </script>
</body>
</html>
