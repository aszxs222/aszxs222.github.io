<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发现音乐 - 网易云风格</title>
    <script src="/redirect.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        .navbar {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 30px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.5em;
            font-weight: bold;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .back-home {
            color: #e94560;
            text-decoration: none;
        }
        .nav-links {
            flex: 1;
            display: flex;
            gap: 20px;
        }
        .nav-links a {
            color: #ccc;
            text-decoration: none;
            padding: 5px 0;
        }
        .nav-links a.active {
            color: #e94560;
            border-bottom: 2px solid #e94560;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .playlist-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .playlist-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.1);
        }
        .playlist-cover {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .playlist-name {
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .playlist-count {
            font-size: 0.75em;
            color: #888;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">🎵 网易云风格</div>
        <a href="/musicmanji/" class="back-home">← 返回平台选择</a>
        <div class="nav-links">
            <a href="/musicmanji/wy/discover.html" class="active">发现音乐</a>
            <a href="/musicmanji/wy/my.html">我的音乐</a>
            <a href="/musicmanji/wy/friend.html">朋友</a>
        </div>
    </div>
    
    <div class="container">
        <h2>🔥 热门推荐</h2>
        <div class="playlist-grid" id="recommendGrid"></div>
        
        <h2>📀 精选歌单</h2>
        <div class="playlist-grid" id="playlistGrid"></div>
        
        <div class="footer">
            🎵 推荐歌单来自网易云音乐
        </div>
    </div>

    <script>
        // 模拟推荐数据（实际可调用API）
        const recommendSongs = [
            { name: "周杰伦 - 晴天", singer: "周杰伦" },
            { name: "陈奕迅 - 十年", singer: "陈奕迅" },
            { name: "邓紫棋 - 光年之外", singer: "邓紫棋" },
            { name: "林俊杰 - 不为谁而作的歌", singer: "林俊杰" },
            { name: "Taylor Swift - Love Story", singer: "Taylor Swift" },
            { name: "Imagine Dragons - Believer", singer: "Imagine Dragons" }
        ];
        
        const playlists = [
            { name: "华语流行热歌榜", count: 50, icon: "🎤" },
            { name: "欧美热门单曲", count: 40, icon: "🌍" },
            { name: "纯音乐放松专区", count: 35, icon: "🎹" },
            { name: "摇滚经典永流传", count: 30, icon: "🎸" },
            { name: "说唱新势力", count: 45, icon: "🎙️" },
            { name: "电子音乐能量站", count: 38, icon: "⚡" }
        ];
        
        function renderRecommend() {
            const grid = document.getElementById('recommendGrid');
            grid.innerHTML = recommendSongs.map(song => `
                <div class="playlist-card" onclick="searchAndPlay('${song.name.split(' - ')[1] || song.name}')">
                    <div class="playlist-cover">🎵</div>
                    <div class="playlist-name">${song.name}</div>
                    <div class="playlist-count">${song.singer}</div>
                </div>
            `).join('');
        }
        
        function renderPlaylists() {
            const grid = document.getElementById('playlistGrid');
            grid.innerHTML = playlists.map(pl => `
                <div class="playlist-card">
                    <div class="playlist-cover">${pl.icon}</div>
                    <div class="playlist-name">${pl.name}</div>
                    <div class="playlist-count">${pl.count}首歌曲</div>
                </div>
            `).join('');
        }
        
        function searchAndPlay(keyword) {
            // 跳转到首页并搜索
            localStorage.setItem('wy_search_keyword', keyword);
            window.location.href = '/musicmanji/wy/';
        }
        
        renderRecommend();
        renderPlaylists();
    </script>
</body>
</html>
