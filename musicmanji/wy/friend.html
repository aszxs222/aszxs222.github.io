<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友 - 网易云风格</title>
    <script src="/redirect.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        .navbar {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .logo {
            font-size: 1.5em;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .back-home { color: #e94560; text-decoration: none; }
        .nav-links { flex: 1; display: flex; gap: 20px; }
        .nav-links a { color: #ccc; text-decoration: none; }
        .nav-links a.active { color: #e94560; border-bottom: 2px solid #e94560; }
        .container { max-width: 600px; margin: 0 auto; padding: 30px; }
        .post-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .post-user {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        .user-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
        }
        .user-name { font-weight: bold; }
        .user-time { font-size: 0.75em; color: #888; }
        .post-content {
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .post-song {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .post-actions {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            color: #888;
        }
        .footer { text-align: center; margin-top: 40px; color: #666; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">🎵 网易云风格</div>
        <a href="/musicmanji/" class="back-home">← 返回平台选择</a>
        <div class="nav-links">
            <a href="/musicmanji/wy/discover.html">发现音乐</a>
            <a href="/musicmanji/wy/my.html">我的音乐</a>
            <a href="/musicmanji/wy/friend.html" class="active">朋友</a>
        </div>
    </div>
    
    <div class="container">
        <div id="feedList"></div>
        <div class="footer">🎵 看看朋友们在听什么</div>
    </div>

    <script>
        // 模拟动态数据
        const feedData = [
            { user: "音乐爱好者", avatar: "🎧", time: "5分钟前", content: "这首太有感觉了！单曲循环中...", song: "晴天 - 周杰伦", songId: "1" },
            { user: "夜空中最亮的星", avatar: "⭐", time: "1小时前", content: "每次听都有不同的感动", song: "夜空中最亮的星 - 逃跑计划", songId: "2" },
            { user: "摇滚青年", avatar: "🎸", time: "3小时前", content: "这才是摇滚该有的样子！", song: "Believer - Imagine Dragons", songId: "3" },
            { user: "纯音控", avatar: "🎹", time: "5小时前", content: "学习必备，太静心了", song: "城南花已开 - 三亩地", songId: "4" }
        ];
        
        function renderFeed() {
            const container = document.getElementById('feedList');
            container.innerHTML = feedData.map(post => `
                <div class="post-card">
                    <div class="post-user">
                        <div class="user-avatar">${post.avatar}</div>
                        <div>
                            <div class="user-name">${post.user}</div>
                            <div class="user-time">${post.time}</div>
                        </div>
                    </div>
                    <div class="post-content">${post.content}</div>
                    <div class="post-song" onclick="searchSong('${post.song.split(' - ')[1] || post.song}')">
                        <span>🎵</span>
                        <span>${post.song}</span>
                        <span style="margin-left:auto;">▶ 播放</span>
                    </div>
                    <div class="post-actions">
                        <span>❤️ 12</span>
                        <span>💬 3</span>
                        <span>↗️ 分享</span>
                    </div>
                </div>
            `).join('');
        }
        
        function searchSong(keyword) {
            localStorage.setItem('wy_search_keyword', keyword);
            window.location.href = '/musicmanji/wy/';
        }
        
        renderFeed();
    </script>
</body>
</html>
