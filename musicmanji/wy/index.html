<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易云风格 - 音乐播放器</title>
    <script src="/redirect.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        
        /* 顶部导航 */
        .navbar {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 30px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.5em;
            font-weight: bold;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .back-home {
            color: #e94560;
            text-decoration: none;
            font-size: 0.9em;
        }
        .nav-links {
            flex: 1;
            display: flex;
            gap: 20px;
        }
        .nav-links a {
            color: #ccc;
            text-decoration: none;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 搜索条 */
        .search-section {
            background: rgba(255,255,255,0.05);
            border-radius: 50px;
            padding: 5px 15px;
            display: flex;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        .search-section input {
            flex: 1;
            background: none;
            border: none;
            padding: 12px;
            color: #fff;
            font-size: 1em;
            outline: none;
        }
        .search-section button {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border: none;
            padding: 8px 25px;
            border-radius: 40px;
            color: #fff;
            cursor: pointer;
        }
        
        /* 主内容区 - 类似网易云两栏布局 */
        .main-content {
            display: flex;
            gap: 30px;
        }
        
        /* 左侧 - 播放器 */
        .player-panel {
            width: 380px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 100px;
            height: fit-content;
        }
        .cover-art {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            margin-bottom: 20px;
        }
        .song-title {
            font-size: 1.3em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }
        .song-artist {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        
        .progress-area {
            margin: 20px 0;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            cursor: pointer;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            width: 0%;
            border-radius: 2px;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75em;
            color: #888;
            margin-top: 5px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 20px 0;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2em;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn.play {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            font-size: 1.5em;
            width: 55px;
            height: 55px;
        }
        
        .volume-row {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .volume-slider {
            width: 100px;
        }
        
        /* 右侧 - 搜索结果/播放列表 */
        .list-panel {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        .list-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-weight: bold;
        }
        .song-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .song-item:hover {
            background: rgba(255,255,255,0.05);
        }
        .song-index {
            width: 40px;
            color: #666;
        }
        .song-info {
            flex: 1;
        }
        .song-name {
            font-weight: 500;
        }
        .song-singer {
            font-size: 0.8em;
            color: #888;
        }
        .song-play {
            color: #e94560;
            font-size: 1.2em;
        }
        
        /* 歌词面板 */
        .lyrics-panel {
            margin-top: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            max-height: 250px;
            overflow-y: auto;
        }
        .lyrics-line {
            text-align: center;
            padding: 8px;
            color: #aaa;
            font-size: 0.85em;
        }
        .lyrics-line.active {
            color: #e94560;
            font-weight: bold;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #666;
        }
        
        @media (max-width: 900px) {
            .main-content { flex-direction: column; }
            .player-panel { width: 100%; position: static; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">🎵 网易云风格</div>
        <a href="/musicmanji/" class="back-home">← 返回平台选择</a>
        <div class="nav-links">
            <a href="#">发现音乐</a>
            <a href="#">我的音乐</a>
            <a href="#">朋友</a>
        </div>
    </div>
    
    <div class="container">
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="搜索歌曲..." value="周杰伦">
            <button id="searchBtn">搜索</button>
        </div>
        
        <div class="main-content">
            <div class="player-panel">
                <div class="cover-art" id="coverArt">🎵</div>
                <div class="song-title" id="songTitle">未选择歌曲</div>
                <div class="song-artist" id="songArtist">请搜索并选择</div>
                
                <div class="progress-area">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-info">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="ctrl-btn" id="prevBtn">⏮</button>
                    <button class="ctrl-btn play" id="playBtn">▶</button>
                    <button class="ctrl-btn" id="nextBtn">⏭</button>
                </div>
                
                <div class="volume-row">
                    <span>🔊</span>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
                </div>
            </div>
            
            <div class="list-panel">
                <div class="list-header">📋 搜索结果</div>
                <div id="searchResults"></div>
            </div>
        </div>
        
        <div class="lyrics-panel" id="lyricsPanel">
            <div style="text-align:center;color:#888;">暂无歌词</div>
        </div>
        
        <div class="footer">
            🎵 数据来自网易云音乐API | 仅供学习使用
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const API_BASE = 'https://api.vkeys.cn/v2/music/netease';
        let currentSongList = [];
        let currentIndex = 0;
        let lyricsData = [];
        
        const audio = document.getElementById('audioPlayer');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const searchResults = document.getElementById('searchResults');
        const coverArt = document.getElementById('coverArt');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const volumeSlider = document.getElementById('volumeSlider');
        const lyricsPanel = document.getElementById('lyricsPanel');
        
        async function fetchAPI(url) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.code === 200) return data;
                return { error: data.message || '请求失败' };
            } catch (e) {
                return { error: '网络错误' };
            }
        }
        
        async function searchMusic() {
            const query = searchInput.value.trim();
            if (!query) return;
            
            searchResults.innerHTML = '<div style="padding:20px;text-align:center;">搜索中...</div>';
            
            const url = `${API_BASE}?word=${encodeURIComponent(query)}`;
            const data = await fetchAPI(url);
            
            if (data.error || !data.data || !data.data.length) {
                searchResults.innerHTML = '<div style="padding:20px;text-align:center;">未找到结果</div>';
                return;
            }
            
            currentSongList = data.data;
            renderResults(currentSongList);
        }
        
        function renderResults(songs) {
            searchResults.innerHTML = songs.map((song, idx) => `
                <div class="song-item" data-index="${idx}">
                    <div class="song-index">${idx + 1}</div>
                    <div class="song-info">
                        <div class="song-name">${song.song || '未知'}</div>
                        <div class="song-singer">${song.singer || '未知歌手'}</div>
                    </div>
                    <div class="song-play">▶</div>
                </div>
            `).join('');
            
            document.querySelectorAll('.song-item').forEach(item => {
                item.addEventListener('click', () => {
                    const idx = parseInt(item.dataset.index);
                    playSong(idx);
                });
            });
        }
        
        async function playSong(idx) {
            currentIndex = idx;
            const song = currentSongList[currentIndex];
            
            songTitle.textContent = song.song || '未知歌曲';
            songArtist.textContent = song.singer || '未知歌手';
            coverArt.textContent = song.album ? '💿' : '🎵';
            
            const url = `${API_BASE}?id=${song.id}`;
            const data = await fetchAPI(url);
            
            if (data.data && data.data.url) {
                audio.src = data.data.url;
                audio.play();
                playBtn.textContent = '⏸';
                await fetchLyrics(song.id);
            } else {
                console.error('获取播放地址失败');
            }
        }
        
        async function fetchLyrics(id) {
            const url = `https://api.vkeys.cn/v2/music/netease/lyric?id=${id}`;
            const data = await fetchAPI(url);
            
            if (data.data && data.data.lrc) {
                lyricsData = parseLyrics(data.data.lrc);
                renderLyrics(lyricsData);
            } else {
                lyricsPanel.innerHTML = '<div style="text-align:center;color:#888;">暂无歌词</div>';
            }
        }
        
        function parseLyrics(lrcText) {
            const lines = lrcText.split('\n');
            const result = [];
            const regex = /\[(\d+):(\d+\.?\d*)\]/;
            for (const line of lines) {
                const match = line.match(regex);
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseFloat(match[2]);
                    const time = minutes * 60 + seconds;
                    const text = line.replace(regex, '').trim();
                    if (text) result.push({ time, text });
                }
            }
            return result.sort((a, b) => a.time - b.time);
        }
        
        function renderLyrics(lyrics) {
            if (!lyrics.length) {
                lyricsPanel.innerHTML = '<div style="text-align:center;color:#888;">暂无歌词</div>';
                return;
            }
            lyricsPanel.innerHTML = lyrics.map(l => 
                `<div class="lyrics-line" data-time="${l.time}">${l.text}</div>`
            ).join('');
        }
        
        function updateLyrics(currentTime) {
            const lines = document.querySelectorAll('.lyrics-line');
            let active = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].time) active = i;
                else break;
            }
            lines.forEach((line, idx) => {
                if (idx === active) {
                    line.classList.add('active');
                    line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    line.classList.remove('active');
                }
            });
        }
        
        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.textContent = '⏸';
            } else {
                audio.pause();
                playBtn.textContent = '▶';
            }
        }
        
        function prevSong() {
            if (currentSongList.length === 0) return;
            currentIndex = (currentIndex - 1 + currentSongList.length) % currentSongList.length;
            playSong(currentIndex);
        }
        
        function nextSong() {
            if (currentSongList.length === 0) return;
            currentIndex = (currentIndex + 1) % currentSongList.length;
            playSong(currentIndex);
        }
        
        function updateProgress() {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalTimeEl.textContent = formatTime(audio.duration);
                updateLyrics(audio.currentTime);
            }
        }
        
        function seekTo(e) {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        searchBtn.addEventListener('click', searchMusic);
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchMusic(); });
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        progressBar.addEventListener('click', seekTo);
        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value / 100; });
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('loadedmetadata', () => { totalTimeEl.textContent = formatTime(audio.duration); });
        audio.addEventListener('ended', nextSong);
        
        // 初始搜索
        searchMusic();
    </script>
</body>
</html>
