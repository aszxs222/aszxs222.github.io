<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐专区 - ASZXS工具集</title>
    <script src="/redirect.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #e94560;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 50px;
        }
        .platform-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }
        .platform-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            display: block;
        }
        .platform-card:hover {
            transform: translateY(-10px);
            background: rgba(255,255,255,0.1);
        }
        .platform-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        .platform-name {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .platform-desc {
            color: #aaa;
            font-size: 0.9em;
        }
        .netease:hover {
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
        }
        .qq:hover {
            box-shadow: 0 0 30px rgba(0, 164, 255, 0.3);
        }
        .footer {
            text-align: center;
            margin-top: 60px;
            color: #666;
        }
        @media (max-width: 600px) {
            .platform-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← 返回首页</a>
        <h1>🎵 音乐专区</h1>
        <p class="subtitle">选择音乐平台，享受高品质音乐</p>
        
        <div class="platform-grid">
            <a href="/musicmanji/wy/" class="platform-card netease">
                <div class="platform-icon">🎧</div>
                <div class="platform-name">网易云音乐</div>
                <div class="platform-desc">海量曲库 · 每日推荐 · 心动模式</div>
            </a>
            <a href="/musicmanji/qq/" class="platform-card qq">
                <div class="platform-icon">🎵</div>
                <div class="platform-name">QQ音乐</div>
                <div class="platform-desc">千万正版 · 无损音质 · 榜单推荐</div>
            </a>
        </div>
        
        <div class="footer">
            <p>所有音乐数据均来自官方API | 仅供学习使用</p>
        </div>
    </div>
</body>
</html>
