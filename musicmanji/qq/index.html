<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ音乐风格 - 音乐播放器</title>
    <script src="/redirect.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #0f1535 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        
        /* QQ音乐风格导航 - 深色+蓝色调 */
        .navbar {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 30px;
            border-bottom: 1px solid rgba(0,164,255,0.3);
        }
        .logo {
            font-size: 1.5em;
            font-weight: bold;
            color: #00a4ff;
        }
        .back-home {
            color: #00a4ff;
            text-decoration: none;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }
        
        .search-section {
            background: rgba(255,255,255,0.08);
            border-radius: 40px;
            padding: 5px 20px;
            display: flex;
            margin-bottom: 30px;
            border: 1px solid rgba(0,164,255,0.3);
        }
        .search-section input {
            flex: 1;
            background: none;
            border: none;
            padding: 14px;
            color: #fff;
            font-size: 1em;
        }
        .search-section button {
            background: #00a4ff;
            border: none;
            padding: 8px 30px;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        
        .main-content {
            display: flex;
            gap: 30px;
        }
        
        .player-panel {
            width: 380px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,164,255,0.2);
        }
        .cover-art {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #00a4ff, #0066cc);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            margin-bottom: 20px;
        }
        .song-title {
            font-size: 1.3em;
            font-weight: bold;
            text-align: center;
        }
        .song-artist {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin: 5px 0 20px;
        }
        
        .progress-area {
            margin: 20px 0;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            cursor: pointer;
        }
        .progress-fill {
            height: 100%;
            background: #00a4ff;
            width: 0%;
            border-radius: 2px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 20px 0;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2em;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        .ctrl-btn.play {
            background: #00a4ff;
            font-size: 1.5em;
            width: 55px;
            height: 55px;
        }
        
        .list-panel {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .list-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(0,164,255,0.2);
            color: #00a4ff;
        }
        .song-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .song-item:hover {
            background: rgba(0,164,255,0.1);
        }
        .song-info {
            flex: 1;
        }
        .song-name { font-weight: 500; }
        .song-singer { font-size: 0.8em; color: #888; }
        
        .lyrics-panel {
            margin-top: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
        .lyrics-line {
            text-align: center;
            padding: 6px;
            color: #aaa;
        }
        .lyrics-line.active {
            color: #00a4ff;
            font-weight: bold;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">🎵 QQ音乐</div>
        <a href="/musicmanji/" class="back-home">← 返回平台选择</a>
    </div>
    
    <div class="container">
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="搜索歌曲..." value="周杰伦">
            <button id="searchBtn">搜索</button>
        </div>
        
        <div class="main-content">
            <div class="player-panel">
                <div class="cover-art" id="coverArt">🎵</div>
                <div class="song-title" id="songTitle">未选择歌曲</div>
                <div class="song-artist" id="songArtist">请搜索并选择</div>
                
                <div class="progress-area">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-info" style="display:flex;justify-content:space-between;margin-top:5px;">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="ctrl-btn" id="prevBtn">⏮</button>
                    <button class="ctrl-btn play" id="playBtn">▶</button>
                    <button class="ctrl-btn" id="nextBtn">⏭</button>
                </div>
                
                <div style="display:flex;align-items:center;gap:10px;justify-content:center;margin-top:15px;">
                    <span>🔊</span>
                    <input type="range" id="volumeSlider" min="0" max="100" value="80" style="width:100px;">
                </div>
            </div>
            
            <div class="list-panel">
                <div class="list-header">📋 搜索结果</div>
                <div id="searchResults"></div>
            </div>
        </div>
        
        <div class="lyrics-panel" id="lyricsPanel">
            <div style="text-align:center;color:#888;">暂无歌词</div>
        </div>
        
        <div class="footer">
            🎵 数据来自QQ音乐API | 仅供学习使用
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const API_BASE = 'https://api.vkeys.cn/v2/music/tencent';
        let currentSongList = [];
        let currentIndex = 0;
        let lyricsData = [];
        
        const audio = document.getElementById('audioPlayer');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const searchResults = document.getElementById('searchResults');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const volumeSlider = document.getElementById('volumeSlider');
        const lyricsPanel = document.getElementById('lyricsPanel');
        
        async function fetchAPI(url) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.code === 200) return data;
                return { error: data.message || '请求失败' };
            } catch (e) {
                return { error: '网络错误' };
            }
        }
        
        async function searchMusic() {
            const query = searchInput.value.trim();
            if (!query) return;
            
            searchResults.innerHTML = '<div style="padding:20px;text-align:center;">搜索中...</div>';
            
            const url = `${API_BASE}?word=${encodeURIComponent(query)}`;
            const data = await fetchAPI(url);
            
            if (data.error || !data.data || !data.data.length) {
                searchResults.innerHTML = '<div style="padding:20px;text-align:center;">未找到结果</div>';
                return;
            }
            
            currentSongList = data.data;
            searchResults.innerHTML = currentSongList.map((song, idx) => `
                <div class="song-item" data-index="${idx}">
                    <div class="song-info">
                        <div class="song-name">${song.song || '未知'}</div>
                        <div class="song-singer">${song.singer || '未知歌手'}</div>
                    </div>
                    <div style="color:#00a4ff;">▶</div>
                </div>
            `).join('');
            
            document.querySelectorAll('.song-item').forEach(item => {
                item.addEventListener('click', () => playSong(parseInt(item.dataset.index)));
            });
        }
        
        async function playSong(idx) {
            currentIndex = idx;
            const song = currentSongList[currentIndex];
            songTitle.textContent = song.song || '未知歌曲';
            songArtist.textContent = song.singer || '未知歌手';
            
            const url = `${API_BASE}?id=${song.id}`;
            const data = await fetchAPI(url);
            
            if (data.data && data.data.url) {
                audio.src = data.data.url;
                audio.play();
                playBtn.textContent = '⏸';
                await fetchLyrics(song.id);
            }
        }
        
        async function fetchLyrics(id) {
            const url = `https://api.vkeys.cn/v2/music/netease/lyric?id=${id}`;
            const data = await fetchAPI(url);
            if (data.data && data.data.lrc) {
                lyricsData = parseLyrics(data.data.lrc);
                lyricsPanel.innerHTML = lyricsData.map(l => `<div class="lyrics-line" data-time="${l.time}">${l.text}</div>`).join('');
            } else {
                lyricsPanel.innerHTML = '<div style="text-align:center;color:#888;">暂无歌词</div>';
            }
        }
        
        function parseLyrics(lrcText) {
            const lines = lrcText.split('\n');
            const result = [];
            const regex = /\[(\d+):(\d+\.?\d*)\]/;
            for (const line of lines) {
                const match = line.match(regex);
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseFloat(match[2]);
                    const time = minutes * 60 + seconds;
                    const text = line.replace(regex, '').trim();
                    if (text) result.push({ time, text });
                }
            }
            return result;
        }
        
        function updateLyrics(currentTime) {
            const lines = document.querySelectorAll('.lyrics-line');
            let active = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].time) active = i;
                else break;
            }
            lines.forEach((line, idx) => {
                if (idx === active) {
                    line.classList.add('active');
                    line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    line.classList.remove('active');
                }
            });
        }
        
        function togglePlay() {
            if (audio.paused) { audio.play(); playBtn.textContent = '⏸'; }
            else { audio.pause(); playBtn.textContent = '▶'; }
        }
        
        function prevSong() {
            if (currentSongList.length === 0) return;
            currentIndex = (currentIndex - 1 + currentSongList.length) % currentSongList.length;
            playSong(currentIndex);
        }
        
        function nextSong() {
            if (currentSongList.length === 0) return;
            currentIndex = (currentIndex + 1) % currentSongList.length;
            playSong(currentIndex);
        }
        
        function updateProgress() {
            if (audio.duration) {
                progressFill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalTimeEl.textContent = formatTime(audio.duration);
                updateLyrics(audio.currentTime);
            }
        }
        
        function seekTo(e) {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        searchBtn.addEventListener('click', searchMusic);
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        progressBar.addEventListener('click', seekTo);
        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value / 100; });
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('ended', nextSong);
        
        searchMusic();
    </script>
</body>
</html>
