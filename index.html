<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASZXS · 工具集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0b1a;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 700px;
        }
        .logo {
            font-size: 4em;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        .tagline {
            font-size: 1.2em;
            color: #888;
            margin-bottom: 40px;
        }
        .actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 40px;
            border: none;
            border-radius: 16px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(167, 139, 250, 0.3);
        }
        .btn-outline {
            background: transparent;
            color: #aaa;
            border: 1px solid #2a2a4a;
        }
        .btn-outline:hover {
            background: #1a1a35;
            color: #fff;
        }
        .footer {
            margin-top: 60px;
            color: #333;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚡ ASZXS</div>
        <div class="tagline">轻量 · 干净 · 实用的在线工具集</div>
        <div class="actions">
            <a href="/login/" class="btn btn-primary">登录</a>
            <a href="/register/" class="btn btn-outline">注册</a>
        </div>
        <div class="footer">© 2026 ASZXS · 所有数据加密存储</div>
    </div>
</body>
</html>
